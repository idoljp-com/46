
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>画像中央部分をコピー</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #copyButton {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 0;
      border: none;
      outline: none;
      background: #000;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #preview {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    #message {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 12px 22px;
      border-radius: 24px;
      background: rgba(30, 30, 30, 0.88);
      color: #fff;
      font-size: 15px;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #message.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <button
    id="copyButton"
    type="button"
    aria-label="中央の正方形画像をコピー"
  >
    <img id="preview" alt="タップして中央部分をコピー">
  </button>

  <div id="message" role="status" aria-live="polite">
    コピーしました
  </div>

  <script>
    // =====================================
    // 設定
    // =====================================

    // 実際のCloudflare Workers URLに変更
    const WORKER_URL =
      "https://copy.snouts-devout-7m.workers.dev/";

    // URL例:
    // https://username.github.io/?img=28522-dfd7c6707476e6ae55b6bfbea0e8a21f

    const params = new URLSearchParams(location.search);

    const imgId = params.get("img") ||
      "28522-dfd7c6707476e6ae55b6bfbea0e8a21f";

    // =====================================
    // HTML要素
    // =====================================

    const preview = document.getElementById("preview");
    const copyButton = document.getElementById("copyButton");
    const message = document.getElementById("message");

    let messageTimer;
    let copying = false;

    // =====================================
    // 画像IDの検証
    // =====================================

    if (!/^[a-zA-Z0-9_-]+$/.test(imgId)) {
      preview.removeAttribute("src");
      copyButton.disabled = true;
      showMessage("画像IDが不正です");
    } else if (
      !/^https:\/\/[a-zA-Z0-9.-]+\/?$/.test(WORKER_URL)
    ) {
      copyButton.disabled = true;
      showMessage("WorkersのURLを設定してください");
    } else {
      // Workers経由で画像を取得
      const imageUrl =
        `${WORKER_URL}?img=${encodeURIComponent(imgId)}`;

      preview.crossOrigin = "anonymous";
      preview.src = imageUrl;
    }

    // =====================================
    // メッセージ表示
    // =====================================

    function showMessage(text) {
      message.textContent = text;
      message.classList.add("show");

      clearTimeout(messageTimer);

      messageTimer = setTimeout(() => {
        message.classList.remove("show");
      }, 2000);
    }

    // =====================================
    // 画像の中央正方形をコピー
    // =====================================

    async function copyCenterSquare() {
      if (copying) return;

      if (!preview.complete || !preview.naturalWidth) {
        showMessage("画像を読み込んでいます");
        return;
      }

      copying = true;

      try {
        const width = preview.naturalWidth;
        const height = preview.naturalHeight;

        // 短辺を一辺とする最大の正方形
        const side = Math.min(width, height);

        // 中央位置を算出
        const sx = (width - side) / 2;
        const sy = (height - side) / 2;

        // 正方形のCanvasを作成
        const canvas = document.createElement("canvas");
        canvas.width = side;
        canvas.height = side;

        const ctx = canvas.getContext("2d");

        if (!ctx) {
          throw new Error("Canvasを利用できません");
        }

        // 元画像の中央部分だけを切り抜く
        ctx.drawImage(
          preview,
          sx, sy, side, side,
          0, 0, side, side
        );

        // PNGに変換
        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob((result) => {
            if (result) {
              resolve(result);
            } else {
              reject(new Error("画像変換に失敗しました"));
            }
          }, "image/png");
        });

        // 画像をクリップボードにコピー
        if (
          !navigator.clipboard ||
          typeof ClipboardItem === "undefined"
        ) {
          throw new Error(
            "このブラウザでは画像コピーを利用できません"
          );
        }

        await navigator.clipboard.write([
          new ClipboardItem({
            "image/png": blob
          })
        ]);

        showMessage("中央の正方形画像をコピーしました");

      } catch (error) {
        console.error("コピーエラー:", error);

        if (error.name === "SecurityError") {
          showMessage("画像にアクセスできません。Workersの設定を確認してください");
        } else if (error.name === "NotAllowedError") {
          showMessage("クリップボードへのアクセスが許可されていません");
        } else {
          showMessage("コピーに失敗しました。HTTPS環境を確認してください");
        }

      } finally {
        copying = false;
      }
    }

    // 画面全体のどこをクリック・タップしても実行
    copyButton.addEventListener("click", copyCenterSquare);

    // =====================================
    // 画像読み込みエラー
    // =====================================

    preview.addEventListener("error", () => {
      showMessage("画像を読み込めませんでした");
    });
  </script>

</body>
</html>
