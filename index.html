<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>46</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
    }
  </style>
</head>
<body>
  <img id="main-image" src="" alt="">

  <script>
    const params = new URLSearchParams(window.location.search);
    const img = params.get("img");

    if (img && /^[a-zA-Z0-9_-]+$/.test(img)) {
      document.getElementById("main-image").src =
        `https://idoljp.com/files/src/${img}.jpg`;
    }
  </script>

  <script async
    src="https://adm.shinobi.jp/st/auto.js"
    data-admax-id="c1c803c7ccf6204879512da3acb766d6">
  </script>
</body>
</html>
