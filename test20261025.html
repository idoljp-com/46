<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>画像評価</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      overscroll-behavior: none;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #image-area {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }

    #photo {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      text-align: center;
      color: #aaa;
      font-size: 14px;
      line-height: 1.7;
      pointer-events: none;
    }

    #rating-bar {
      flex-shrink: 0;
      display: flex;
      width: 100%;
      gap: 1px;
      padding-bottom: env(safe-area-inset-bottom);
      background: #222;
    }

    .rating {
      flex: 1;
      min-width: 0;
      height: 64px;
      border: 0;
      border-radius: 0;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .rating:active {
      filter: brightness(0.8);
    }

    .rating:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #good {
      background: #168447;
    }

    #soso {
      background: #777;
    }

    #bad {
      background: #c63838;
    }
  </style>
</head>

<body>
  <main id="app">
    <div id="image-area">
      <img id="photo" alt="" hidden>
    </div>

    <div id="message">データを読み込み中...</div>

    <div id="rating-bar">
      <button class="rating" id="good" data-rating="GOOD">
        GOOD
      </button>
      <button class="rating" id="soso" data-rating="SOSO">
        SOSO
      </button>
      <button class="rating" id="bad" data-rating="BAD">
        BAD
      </button>
    </div>
  </main>

  <script>
    'use strict';

    // 公開スプレッドシート
    const SPREADSHEET_URL =
      'https://docs.google.com/spreadsheets/d/e/' +
      '2PACX-1vRjdk7wHXk81Qv5pBr25he2BfHnMi649uNpmPveZrtydzYMam2eUfOd7It1dtt0ficMuVQj7wZxO58-';

    const SHEET_GID = '1405762441';

    const photo = document.getElementById('photo');
    const message = document.getElementById('message');
    const buttons = [...document.querySelectorAll('.rating')];

    let candidates = [];
    let remaining = [];
    let currentItem = null;
    let loadingNext = false;

    // Google Visualization APIのURL
    const DATA_URL =
      SPREADSHEET_URL +
      '/gviz/tq?tqx=out:json&gid=' + SHEET_GID;

    function normalize(value) {
      return String(value ?? '').trim();
    }

    function cellValue(cell) {
      if (!cell) return '';
      return cell.v == null ? '' : String(cell.v);
    }

    function getColumnIndex(columns, name) {
      return columns.findIndex(column =>
        normalize(column.label) === name ||
        normalize(column.id) === name
      );
    }

    // データを読み込み、条件に合う行だけを抽出
    async function loadData() {
      try {
        const response = await fetch(DATA_URL, {
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const text = await response.text();

        // Googleが返すJSONP形式をJSONに変換
        const match = text.match(
          /google\.visualization\.Query\.setResponse\(([\s\S]*?)\);?\s*$/
        );

        if (!match) {
          throw new Error('データ形式を解析できません');
        }

        const result = JSON.parse(match[1]);

        if (result.status !== 'ok') {
          throw new Error('スプレッドシートの取得に失敗しました');
        }

        const table = result.table;
        const columns = table.cols;

        const srcIndex = getColumnIndex(columns, 'src');
        const newtagIndex = getColumnIndex(columns, 'Newtag');

        // 「その他・エラー」の判定に使う列
        const tagsIndex = getColumnIndex(columns, 'tags');

        if (srcIndex < 0 || newtagIndex < 0 || tagsIndex < 0) {
          throw new Error(
            'src、Newtag、tags の列を確認してください'
          );
        }

        candidates = table.rows
          .map(row => {
            const cells = row.c || [];

            return {
              src: normalize(cellValue(cells[srcIndex])),
              newtag: normalize(cellValue(cells[newtagIndex])),
              tags: normalize(cellValue(cells[tagsIndex]))
            };
          })
          .filter(item => {
            if (!item.src) return false;
            if (item.newtag !== '') return false;

            // タグが「その他」または「エラー」の行を除外
            const tags = item.tags
              .split(/[,，、\n]/)
              .map(tag => tag.trim());

            if (tags.includes('その他')) return false;
            if (tags.includes('エラー')) return false;

            return true;
          });

        if (candidates.length === 0) {
          showMessage('条件に合う画像がありません');
          return;
        }

        remaining = [...candidates];
        showNextImage();

      } catch (error) {
        console.error(error);
        showMessage(
          'データを取得できませんでした。<br>' +
          '公開設定と列名を確認してください。'
        );
      }
    }

    // ランダムに次の画像を選ぶ
    // 一巡するまでは、同じ行を再選択しない
    function pickRandom() {
      if (remaining.length === 0) {
        remaining = [...candidates];
      }

      const index = Math.floor(Math.random() * remaining.length);
      return remaining.splice(index, 1)[0];
    }

    function showMessage(html) {
      photo.hidden = true;
      photo.removeAttribute('src');
      message.innerHTML = html;
    }

    function showNextImage() {
      currentItem = pickRandom();
      loadingNext = true;
      setButtonsDisabled(true);

      message.textContent = '画像を読み込み中...';
      photo.hidden = true;

      photo.onload = () => {
        photo.hidden = false;
        message.textContent = '';
        loadingNext = false;
        setButtonsDisabled(false);
      };

      photo.onerror = () => {
        console.error('画像の読み込みに失敗:', currentItem.src);

        // 読み込めない画像は飛ばして次へ
        loadingNext = false;
        showNextImage();
      };

      photo.src = currentItem.src;
    }

    function setButtonsDisabled(disabled) {
      buttons.forEach(button => {
        button.disabled = disabled;
      });
    }

    // 評価を押したら次の画像へ
    buttons.forEach(button => {
      button.addEventListener('click', () => {
        if (loadingNext || !currentItem) return;

        const rating = button.dataset.rating;

        // 現時点では評価を保存せず、次の画像へ進む
        console.log('評価:', rating, '画像:', currentItem.src);

        showNextImage();
      });
    });

    loadData();
  </script>
</body>
</html>
