<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>画像評価</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #image-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: calc(74px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    #main-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      white-space: pre-line;
      overflow-wrap: anywhere;
      color: #aaa;
      font-size: 15px;
      line-height: 1.8;
    }

    #message[hidden],
    #main-image[hidden] {
      display: none;
    }

    #buttons {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(74px + env(safe-area-inset-bottom));
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      background: #222;
    }

    .rating-button {
      flex: 1;
      min-width: 0;
      height: 74px;
      padding: 0;
      border: 0;
      border-radius: 0;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .rating-button:active {
      filter: brightness(1.2);
    }

    .rating-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    #good {
      background: #17613d;
    }

    #soso {
      background: #505050;
    }

    #bad {
      background: #842d2d;
    }

    @media (max-height: 400px) {
      #image-area {
        bottom: calc(58px + env(safe-area-inset-bottom));
      }

      #buttons {
        height: calc(58px + env(safe-area-inset-bottom));
      }

      .rating-button {
        height: 58px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="image-area">
      <img id="main-image" alt="評価する画像" hidden>
      <div id="message">データを読み込んでいます...</div>
    </div>

    <div id="buttons">
      <button class="rating-button" id="good" disabled>GOOD</button>
      <button class="rating-button" id="soso" disabled>SOSO</button>
      <button class="rating-button" id="bad" disabled>BAD</button>
    </div>
  </div>

  <script>
    'use strict';

    // ========================================
    // スプレッドシート設定
    // ========================================

    const DATA_URL =
      'https://docs.google.com/spreadsheets/d/e/' +
      '2PACX-1vRjdk7wHXk81Qv5pBr25he2BfHnMi649uNpmPveZrtydzYMam2eUfOd7It1dtt0ficMuVQj7wZxO58-' +
      '/pub?gid=1405762441&single=true&output=csv';

    // ========================================
    // DOM
    // ========================================

    const imageElement = document.getElementById('main-image');
    const messageElement = document.getElementById('message');

    const buttons = [
      document.getElementById('good'),
      document.getElementById('soso'),
      document.getElementById('bad')
    ];

    // ========================================
    // 状態
    // ========================================

    let images = [];
    let remainingImages = [];
    let currentImage = null;
    let isLoadingImage = false;
    let requestToken = 0;

    const failedImages = new Set();

    // ========================================
    // 表示制御
    // ========================================

    function setMessage(text) {
      messageElement.textContent = text;
      messageElement.hidden = false;
    }

    function hideMessage() {
      messageElement.hidden = true;
    }

    function setButtonsEnabled(enabled) {
      buttons.forEach(button => {
        button.disabled = !enabled;
      });
    }

    // ========================================
    // CSV解析
    // カンマ、改行、ダブルクォートに対応
    // ========================================

    function parseCSV(text) {
      const rows = [];

      let row = [];
      let value = '';
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (char === '"') {
          if (quoted && text[i + 1] === '"') {
            value += '"';
            i++;
          } else {
            quoted = !quoted;
          }
        } else if (char === ',' && !quoted) {
          row.push(value);
          value = '';
        } else if (
          (char === '\n' || char === '\r') &&
          !quoted
        ) {
          if (char === '\r' && text[i + 1] === '\n') {
            i++;
          }

          row.push(value);

          if (row.some(cell => cell.trim() !== '')) {
            rows.push(row);
          }

          row = [];
          value = '';
        } else {
          value += char;
        }
      }

      if (value !== '' || row.length > 0) {
        row.push(value);

        if (row.some(cell => cell.trim() !== '')) {
          rows.push(row);
        }
      }

      return rows;
    }

    // ========================================
    // CSVから画像URLを抽出
    // srcが空でなく、Newtagが空欄の行のみ対象
    // ========================================

    function extractImagesFromCSV(csvText) {
      const rows = parseCSV(csvText.replace(/^\uFEFF/, ''));

      if (rows.length < 2) {
        throw new Error(
          'CSVにデータ行がありません。'
        );
      }

      const headers = rows[0].map(value =>
        value.trim().toLowerCase()
      );

      const srcIndex = headers.indexOf('src');
      const newtagIndex = headers.indexOf('newtag');

      if (srcIndex === -1 || newtagIndex === -1) {
        throw new Error(
          'src列またはNewtag列が見つかりません。\n' +
          'CSVの1行目の列名を確認してください。'
        );
      }

      const result = [];

      for (const row of rows.slice(1)) {
        const src = (row[srcIndex] || '').trim();
        const newtag = (row[newtagIndex] || '').trim();

        if (!src || newtag !== '') {
          continue;
        }

        // URLとして有効なhttp/httpsのみ採用
        try {
          const url = new URL(src);

          if (url.protocol !== 'http:' && url.protocol !== 'https:') {
            continue;
          }
        } catch {
          continue;
        }

        result.push(src);
      }

      // 同じ画像URLの重複を除去
      return [...new Set(result)];
    }

    // ========================================
    // 配列をランダムにシャッフル
    // ========================================

    function shuffle(array) {
      const result = array.slice();

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [result[i], result[j]] = [
          result[j],
          result[i]
        ];
      }

      return result;
    }

    // ========================================
    // 画像の読み込み確認
    // ========================================

    function preloadImage(src) {
      return new Promise(resolve => {
        const image = new Image();

        image.onload = () => resolve(true);
        image.onerror = () => resolve(false);

        image.src = src;
      });
    }

    // ========================================
    // 表示可能な画像を検査
    // ========================================

    async function validateImages(list) {
      const valid = [];

      for (let i = 0; i < list.length; i++) {
        setMessage(
          '画像を確認しています...\n' +
          (i + 1) + ' / ' + list.length
        );

        const src = list[i];
        const loaded = await preloadImage(src);

        if (loaded) {
          valid.push(src);
        } else {
          failedImages.add(src);
        }
      }

      return valid;
    }

    // ========================================
    // CSVデータ取得
    // ========================================

    async function loadData() {
      setButtonsEnabled(false);
      imageElement.hidden = true;

      setMessage('データを読み込んでいます...');

      try {
        const response = await fetch(DATA_URL, {
          method: 'GET',
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(
            'CSV取得失敗: HTTP ' + response.status
          );
        }

        const csvText = await response.text();

        if (
          csvText.trimStart().startsWith('<!DOCTYPE html') ||
          csvText.trimStart().startsWith('<html')
        ) {
          throw new Error(
            'CSVではなくHTMLが返されました。\n' +
            '公開URLを確認してください。'
          );
        }

        const candidates = extractImagesFromCSV(csvText);

        if (candidates.length === 0) {
          throw new Error(
            '表示対象の画像がありません。\n' +
            'srcが入力され、Newtagが空欄の行を確認してください。'
          );
        }

        setMessage(
          '画像を確認しています...\n' +
          '対象画像：' + candidates.length + ' 枚'
        );

        images = await validateImages(candidates);

        if (images.length === 0) {
          throw new Error(
            '表示可能な画像がありません。\n' +
            'src列のURLや画像へのアクセス制限を確認してください。'
          );
        }

        remainingImages = shuffle(images);

        showNextImage();

      } catch (error) {
        console.error('データ取得エラー:', error);

        imageElement.hidden = true;

        setMessage(
          'データを取得できませんでした。\n\n' +
          (error.message || '不明なエラーが発生しました。') +
          '\n\n公開CSVのURLやアクセス制限を確認してください。'
        );

        setButtonsEnabled(false);
      }
    }

    // ========================================
    // 次の画像を表示
    // ========================================

    async function showNextImage() {
      if (isLoadingImage) {
        return;
      }

      isLoadingImage = true;
      setButtonsEnabled(false);

      try {
        while (remainingImages.length > 0) {
          const src = remainingImages.pop();

          if (failedImages.has(src)) {
            continue;
          }

          const token = ++requestToken;

          setMessage('画像を読み込んでいます...');

          const loaded = await preloadImage(src);

          if (token !== requestToken) {
            return;
          }

          if (!loaded) {
            failedImages.add(src);
            continue;
          }

          currentImage = src;

          imageElement.src = src;
          imageElement.hidden = false;

          hideMessage();
          setButtonsEnabled(true);

          return;
        }

        currentImage = null;
        imageElement.hidden = true;

        setMessage(
          'すべての画像を確認しました。\n\n' +
          '表示可能な画像：' + images.length + ' 枚'
        );

      } finally {
        isLoadingImage = false;
      }
    }

    // ========================================
    // 評価ボタン
    // 現時点では評価を保存せず次の画像へ進む
    // ========================================

    function rateImage(rating) {
      if (!currentImage || isLoadingImage) {
        return;
      }

      console.log(
        '評価:',
        rating,
        '画像URL:',
        currentImage
      );

      currentImage = null;

      showNextImage();
    }

    document.getElementById('good').addEventListener(
      'click',
      () => rateImage('GOOD')
    );

    document.getElementById('soso').addEventListener(
      'click',
      () => rateImage('SOSO')
    );

    document.getElementById('bad').addEventListener(
      'click',
      () => rateImage('BAD')
    );

    // ========================================
    // 起動
    // ========================================

    loadData();
  </script>
</body>
</html>
