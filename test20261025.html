
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>画像評価</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #image-area {
      position: absolute;
      inset: 0 0 calc(74px + env(safe-area-inset-bottom)) 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
    }

    #main-image {
      display: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #message {
      max-width: 90%;
      text-align: center;
      color: #aaa;
      font-size: 15px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    #counter {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.65);
      font-size: 12px;
      pointer-events: none;
    }

    #buttons {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(74px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      display: flex;
      gap: 1px;
      background: #000;
    }

    .rate-button {
      flex: 1;
      min-width: 0;
      height: 74px;
      border: 0;
      margin: 0;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .rate-button:active {
      filter: brightness(1.2);
    }

    .rate-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #good {
      background: #17603b;
    }

    #soso {
      background: #484848;
    }

    #bad {
      background: #842d2d;
    }

    @media (max-height: 420px) {
      #buttons {
        height: calc(54px + env(safe-area-inset-bottom));
      }

      .rate-button {
        height: 54px;
        font-size: 16px;
      }

      #image-area {
        bottom: calc(54px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <div id="counter"></div>

    <div id="image-area">
      <img id="main-image" alt="評価する画像" draggable="false">
      <div id="message">データを取得しています...</div>
    </div>

    <div id="buttons">
      <button class="rate-button" id="good" disabled>GOOD</button>
      <button class="rate-button" id="soso" disabled>SOSO</button>
      <button class="rate-button" id="bad" disabled>BAD</button>
    </div>
  </main>

  <script>
    'use strict';

    // 対象のスプレッドシート
    const SPREADSHEET_ID =
      '1yrelfrbpahuv-Dg1rUsYMlavnOk8siwTAh3Sp8CKW8U';

    // 「取得結果」シートのgid
    const SHEET_GID = '1405762441';

    // Google Sheets Visualization API
    const DATA_URL =
      `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}` +
      `/gviz/tq?tqx=out:json&gid=${SHEET_GID}&headers=1`;

    const imageElement = document.getElementById('main-image');
    const messageElement = document.getElementById('message');
    const counterElement = document.getElementById('counter');

    const buttons = [
      document.getElementById('good'),
      document.getElementById('soso'),
      document.getElementById('bad')
    ];

    let imageList = [];
    let remainingImages = [];
    let currentImage = null;
    let loadingImage = false;

    // 評価結果は現在のページ内で記録するだけで、
    // スプレッドシートへの書き込みは行わない。
    const evaluations = {
      GOOD: 0,
      SOSO: 0,
      BAD: 0
    };

    function setMessage(text) {
      messageElement.textContent = text;
      messageElement.style.display = 'block';
      imageElement.style.display = 'none';
    }

    function setButtonsEnabled(enabled) {
      buttons.forEach(button => {
        button.disabled = !enabled;
      });
    }

    function normalize(value) {
      return String(value ?? '').trim();
    }

    // Visualization APIの応答をJSONとして解析する
    function parseGoogleResponse(responseText) {
      const match = responseText.match(
        /google\.visualization\.Query\.setResponse\(([\s\S]*?)\);?\s*$/
      );

      if (!match) {
        throw new Error(
          'Google Sheetsの応答を解析できません。\n' +
          '公開設定またはアクセス権限を確認してください。'
        );
      }

      return JSON.parse(match[1]);
    }

    // セルの値を取得する
    function getCellValue(cell) {
      if (!cell) return '';

      if (cell.v !== null && cell.v !== undefined) {
        return cell.v;
      }

      return cell.f ?? '';
    }

    async function loadSpreadsheet() {
      setMessage('データを取得しています...');
      setButtonsEnabled(false);

      try {
        const response = await fetch(DATA_URL, {
          method: 'GET',
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(
            `スプレッドシート取得失敗: HTTP ${response.status}`
          );
        }

        const responseText = await response.text();
        const result = parseGoogleResponse(responseText);

        if (result.status !== 'ok') {
          const detail = result.errors
            ?.map(error => error.detailed_message || error.message)
            .filter(Boolean)
            .join('\n');

          throw new Error(
            detail || 'Google Sheetsから正常な応答がありません。'
          );
        }

        const table = result.table;

        if (!table || !Array.isArray(table.cols)) {
          throw new Error('シートのデータ形式が正しくありません。');
        }

        // 列名を特定する
        const headers = table.cols.map(column =>
          normalize(column.label || column.id)
        );

        const srcIndex = headers.findIndex(
          header => header.toLowerCase() === 'src'
        );

        const newtagIndex = headers.findIndex(
          header => header.toLowerCase() === 'newtag'
        );

        if (srcIndex === -1 || newtagIndex === -1) {
          throw new Error(
            '必要な列が見つかりません。\n' +
            '1行目の列名が「src」と「Newtag」になっているか確認してください。'
          );
        }

        // srcが存在し、Newtagが空欄の行だけを抽出する
        const candidates = (table.rows || [])
          .map(row => {
            const cells = row.c || [];

            return {
              src: normalize(getCellValue(cells[srcIndex])),
              newtag: normalize(getCellValue(cells[newtagIndex]))
            };
          })
          .filter(item =>
            item.src !== '' &&
            item.newtag === ''
          );

        // URLの重複を除去する
        imageList = [
          ...new Map(
            candidates.map(item => [item.src, item.src])
          ).values()
        ];

        if (imageList.length === 0) {
          throw new Error(
            '表示できる画像がありません。\n' +
            'src列のURLと、Newtag列が空欄の行を確認してください。'
          );
        }

        // ランダム順に並べ替え、一巡するまで重複を防ぐ
        remainingImages = shuffle([...imageList]);

        showNextImage();

      } catch (error) {
        console.error('データ取得エラー:', error);

        setMessage(
          'データを取得できませんでした。\n\n' +
          (error.message || '不明なエラー') +
          '\n\n' +
          'スプレッドシートの共有設定を確認してください。'
        );

        counterElement.textContent = '';
        setButtonsEnabled(false);
      }
    }

    // Fisher-Yatesシャッフル
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }

      return array;
    }

    function showNextImage() {
      if (loadingImage) return;

      if (remainingImages.length === 0) {
        if (imageList.length === 0) {
          setMessage('表示できる画像がありません。');
          setButtonsEnabled(false);
          return;
        }

        // 全画像を一巡したら再びランダム順にする
        remainingImages = shuffle([...imageList]);

        // 一巡の境界で直前の画像が連続しないようにする
        if (
          remainingImages.length > 1 &&
          remainingImages[0] === currentImage
        ) {
          [remainingImages[0], remainingImages[1]] =
            [remainingImages[1], remainingImages[0]];
        }
      }

      const nextSrc = remainingImages.shift();

      currentImage = nextSrc;
      loadingImage = true;
      setButtonsEnabled(false);
      setMessage('画像を読み込んでいます...');

      const preload = new Image();

      preload.onload = () => {
        imageElement.src = nextSrc;
        imageElement.style.display = 'block';
        messageElement.style.display = 'none';

        counterElement.textContent =
          `${imageList.length - remainingImages.length} / ${imageList.length}`;

        loadingImage = false;
        setButtonsEnabled(true);
      };

      preload.onerror = () => {
        console.warn('画像読み込み失敗:', nextSrc);
        loadingImage = false;

        // 読み込みに失敗した画像は除外して次へ進む
        imageList = imageList.filter(src => src !== nextSrc);
        remainingImages = remainingImages.filter(src => src !== nextSrc);

        if (imageList.length === 0) {
          setMessage('表示できる画像がありません。');
          counterElement.textContent = '';
          setButtonsEnabled(false);
          return;
        }

        showNextImage();
      };

      preload.src = nextSrc;
    }

    function evaluate(type) {
      if (!currentImage || loadingImage) return;

      evaluations[type]++;

      console.log('評価:', {
        type,
        src: currentImage,
        counts: { ...evaluations }
      });

      showNextImage();
    }

    document.getElementById('good').addEventListener('click', () => {
      evaluate('GOOD');
    });

    document.getElementById('soso').addEventListener('click', () => {
      evaluate('SOSO');
    });

    document.getElementById('bad').addEventListener('click', () => {
      evaluate('BAD');
    });

    loadSpreadsheet();
  </script>
</body>
</html>
