<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>画像評価</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #image-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: calc(74px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0;
    }

    #main-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      white-space: pre-line;
      color: #aaa;
      font-size: 15px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    #buttons {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(74px + env(safe-area-inset-bottom));
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      background: #222;
    }

    .rating-button {
      flex: 1;
      min-width: 0;
      height: 74px;
      border: 0;
      border-radius: 0;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .rating-button:active {
      filter: brightness(1.2);
    }

    .rating-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    #good {
      background: #17613d;
    }

    #soso {
      background: #505050;
    }

    #bad {
      background: #842d2d;
    }

    @media (max-height: 400px) {
      #buttons {
        height: calc(58px + env(safe-area-inset-bottom));
      }

      .rating-button {
        height: 58px;
        font-size: 17px;
      }

      #image-area {
        bottom: calc(58px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="image-area">
      <img id="main-image" alt="評価する画像" hidden>
      <div id="message">データを読み込んでいます...</div>
    </div>

    <div id="buttons">
      <button class="rating-button" id="good" disabled>GOOD</button>
      <button class="rating-button" id="soso" disabled>SOSO</button>
      <button class="rating-button" id="bad" disabled>BAD</button>
    </div>
  </div>

  <script>
    'use strict';

    // 公開スプレッドシートの設定
    const SPREADSHEET_ID =
      '2PACX-1vRjdk7wHXk81Qv5pBr25he2BfHnMi649uNpmPveZrtydzYMam2eUfOd7It1dtt0ficMuVQj7wZxO58-';

    const SHEET_GID = '1405762441';

    // gidを指定してデータを取得
    const DATA_URL =
      'https://docs.google.com/spreadsheets/d/e/' +
      SPREADSHEET_ID +
      '/gviz/tq?tqx=out:json&gid=' +
      SHEET_GID;

    const imageElement = document.getElementById('main-image');
    const messageElement = document.getElementById('message');

    const buttons = [
      document.getElementById('good'),
      document.getElementById('soso'),
      document.getElementById('bad')
    ];

    let images = [];
    let remainingImages = [];
    let currentImage = null;
    let isLoadingImage = false;
    let requestToken = 0;

    const failedImages = new Set();

    function setMessage(text) {
      messageElement.textContent = text;
      messageElement.hidden = false;
    }

    function hideMessage() {
      messageElement.hidden = true;
    }

    function setButtonsEnabled(enabled) {
      buttons.forEach(button => {
        button.disabled = !enabled;
      });
    }

    function normalize(value) {
      if (value === null || value === undefined) {
        return '';
      }

      return String(value).trim();
    }

    // Google Visualization APIの値を取得
    function getCellValue(cell) {
      if (!cell) {
        return '';
      }

      if (cell.v !== null && cell.v !== undefined) {
        return cell.v;
      }

      return cell.f ?? '';
    }

    // 公開シートのレスポンスからテーブルを抽出
    function parseGoogleResponse(text) {
      const start = text.indexOf('{');
      const end = text.lastIndexOf('}');

      if (start === -1 || end === -1 || end < start) {
        throw new Error(
          'Google Sheetsから有効なデータが返されませんでした。'
        );
      }

      const jsonText = text.slice(start, end + 1);
      const response = JSON.parse(jsonText);

      if (response.status === 'error') {
        const details = (response.errors || [])
          .map(error => error.detailed_message || error.message)
          .filter(Boolean)
          .join('\n');

        throw new Error(
          details || 'Google Sheets APIでエラーが発生しました。'
        );
      }

      if (!response.table || !Array.isArray(response.table.cols)) {
        throw new Error(
          'シートのデータを確認できません。公開設定を確認してください。'
        );
      }

      return response.table;
    }

    function findColumnIndex(columns, name) {
      const target = name.toLowerCase();

      return columns.findIndex(column => {
        const label = normalize(column.label).toLowerCase();
        const id = normalize(column.id).toLowerCase();

        return label === target || id === target;
      });
    }

    // src列とNewtag列をヘッダー名で特定
    function extractImages(table) {
      const columns = table.cols || [];
      const rows = table.rows || [];

      let srcIndex = findColumnIndex(columns, 'src');
      let newtagIndex = findColumnIndex(columns, 'Newtag');

      // ヘッダーが認識できない場合は先頭行から確認
      if (srcIndex === -1 || newtagIndex === -1) {
        if (!rows.length) {
          throw new Error('シートにデータ行がありません。');
        }

        const firstRow = (rows[0].c || []).map(cell =>
          normalize(getCellValue(cell)).toLowerCase()
        );

        if (srcIndex === -1) {
          srcIndex = firstRow.indexOf('src');
        }

        if (newtagIndex === -1) {
          newtagIndex = firstRow.indexOf('newtag');
        }

        if (srcIndex === -1 || newtagIndex === -1) {
          throw new Error(
            'src列またはNewtag列が見つかりません。\n' +
            '1行目の列名と公開シートを確認してください。'
          );
        }

        rows.shift();
      }

      return rows
        .map(row => {
          const cells = row.c || [];

          return {
            src: normalize(getCellValue(cells[srcIndex])),
            newtag: normalize(getCellValue(cells[newtagIndex]))
          };
        })
        .filter(item => {
          return item.src !== '' && item.newtag === '';
        })
        .map(item => item.src)
        .filter((src, index, array) => {
          return array.indexOf(src) === index;
        });
    }

    // 一巡するまで重複しないようにシャッフル
    function shuffle(array) {
      const result = array.slice();

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    // 画像を実際に読み込めるか確認
    function preloadImage(src) {
      return new Promise(resolve => {
        const image = new Image();

        image.onload = () => resolve(true);
        image.onerror = () => resolve(false);

        image.src = src;
      });
    }

    // 読み込み可能な画像だけを残す
    async function validateImages(list) {
      const valid = [];

      for (let i = 0; i < list.length; i++) {
        const src = list[i];

        setMessage(
          '画像を確認しています...\n' +
          (i + 1) + ' / ' + list.length
        );

        const loaded = await preloadImage(src);

        if (loaded) {
          valid.push(src);
        } else {
          failedImages.add(src);
        }
      }

      return valid;
    }

    async function loadData() {
      setButtonsEnabled(false);
      setMessage('データを読み込んでいます...');

      try {
        const response = await fetch(DATA_URL, {
          method: 'GET',
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(
            'データ取得に失敗しました。HTTP ' + response.status
          );
        }

        const text = await response.text();
        const table = parseGoogleResponse(text);
        const candidates = extractImages(table);

        if (candidates.length === 0) {
          throw new Error(
            '表示できる画像がありません。\n' +
            'src列にURLがあり、Newtag列が空欄の行を確認してください。'
          );
        }

        images = await validateImages(candidates);

        if (images.length === 0) {
          throw new Error(
            '表示できる画像を読み込めませんでした。\n' +
            'src列の画像URLやアクセス制限を確認してください。'
          );
        }

        remainingImages = shuffle(images);
        showNextImage();

      } catch (error) {
        console.error('データ取得エラー:', error);

        imageElement.hidden = true;

        setMessage(
          'データを取得できませんでした。\n\n' +
          (error.message || '不明なエラーが発生しました。') +
          '\n\n「取得結果」シートの公開設定、gid、列名を確認してください。'
        );

        setButtonsEnabled(false);
      }
    }

    async function showNextImage() {
      if (isLoadingImage) {
        return;
      }

      isLoadingImage = true;
      setButtonsEnabled(false);

      try {
        while (remainingImages.length > 0) {
          const src = remainingImages.pop();

          if (failedImages.has(src)) {
            continue;
          }

          const token = ++requestToken;

          setMessage('画像を読み込んでいます...');

          const loaded = await preloadImage(src);

          if (token !== requestToken) {
            return;
          }

          if (!loaded) {
            failedImages.add(src);
            continue;
          }

          currentImage = src;
          imageElement.src = src;
          imageElement.hidden = false;

          hideMessage();
          setButtonsEnabled(true);

          return;
        }

        currentImage = null;
        imageElement.hidden = true;

        setMessage(
          'すべての画像を確認しました。\n\n' +
          '表示可能な画像：' + images.length + ' 枚'
        );

      } finally {
        isLoadingImage = false;
      }
    }

    // 評価ボタンを押すと次の画像へ
    function rateImage(rating) {
      if (!currentImage || isLoadingImage) {
        return;
      }

      // 現時点では評価を保存せず、次の画像へ進む
      console.log('評価:', rating, '画像URL:', currentImage);

      currentImage = null;
      showNextImage();
    }

    document.getElementById('good').addEventListener('click', () => {
      rateImage('GOOD');
    });

    document.getElementById('soso').addEventListener('click', () => {
      rateImage('SOSO');
    });

    document.getElementById('bad').addEventListener('click', () => {
      rateImage('BAD');
    });

    loadData();
  </script>
</body>
</html>
