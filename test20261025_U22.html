
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>画像評価</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #image-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: calc(74px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    #main-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      white-space: pre-line;
      overflow-wrap: anywhere;
      color: #aaa;
      font-size: 15px;
      line-height: 1.8;
    }

    #message[hidden],
    #main-image[hidden] {
      display: none;
    }

    #buttons {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(74px + env(safe-area-inset-bottom));
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      background: #222;
    }

    .rating-button {
      flex: 1;
      min-width: 0;
      height: 74px;
      padding: 0;
      border: 0;
      border-radius: 0;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .rating-button:active {
      filter: brightness(1.2);
    }

    .rating-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    #good {
      background: #17613d;
    }

    #soso {
      background: #505050;
    }

    #bad {
      background: #842d2d;
    }

    @media (max-height: 400px) {
      #image-area {
        bottom: calc(58px + env(safe-area-inset-bottom));
      }

      #buttons {
        height: calc(58px + env(safe-area-inset-bottom));
      }

      .rating-button {
        height: 58px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="image-area">
      <img id="main-image" alt="評価する画像" hidden>
      <div id="message">データを読み込んでいます...</div>
    </div>

    <div id="buttons">
      <button class="rating-button" id="good" disabled>GOOD</button>
      <button class="rating-button" id="soso" disabled>SOSO</button>
      <button class="rating-button" id="bad" disabled>BAD</button>
    </div>
  </div>

  <script>
    'use strict';

    // ========================================
    // 設定
    // ========================================

    const DATA_URL =
      'https://docs.google.com/spreadsheets/d/e/' +
      '2PACX-1vRjdk7wHXk81Qv5pBr25he2BfHnMi649uNpmPveZrtydzYMam2eUfOd7It1dtt0ficMuVQj7wZxO58-' +
      '/pub?gid=1405762441&single=true&output=csv';

    const MAX_AGE = 22;

    const WIKIPEDIA_GROUPS = [
      {
        name: '乃木坂46',
        page: '乃木坂46',
        tableId: 'mwCZE'
      },
      {
        name: '櫻坂46',
        page: '櫻坂46',
        tableId: 'mwB0M'
      },
      {
        name: '日向坂46',
        page: '日向坂46',
        tableId: 'mwCMM'
      }
    ];

    // ========================================
    // DOM
    // ========================================

    const imageElement =
      document.getElementById('main-image');

    const messageElement =
      document.getElementById('message');

    const buttons = [
      document.getElementById('good'),
      document.getElementById('soso'),
      document.getElementById('bad')
    ];

    // ========================================
    // 状態
    // ========================================

    let images = [];
    let remainingImages = [];
    let currentImage = null;
    let currentTag = '';
    let isLoadingImage = false;
    let requestToken = 0;

    const failedImages = new Set();

    // メンバー名 -> 年齢情報
    const eligibleMembers = new Map();

    // ========================================
    // 表示制御
    // ========================================

    function setMessage(text) {
      messageElement.textContent = text;
      messageElement.hidden = false;
    }

    function hideMessage() {
      messageElement.hidden = true;
    }

    function setButtonsEnabled(enabled) {
      buttons.forEach(button => {
        button.disabled = !enabled;
      });
    }

    // ========================================
    // 文字列正規化
    // ========================================

    function normalizeName(value) {
      return String(value ?? '')
        .normalize('NFKC')
        .replace(/[\s\u3000]+/g, '')
        .trim();
    }

    function normalizeHeader(value) {
      return String(value ?? '')
        .replace(/[\s\u3000]+/g, '')
        .replace(/[［\[][^］\]]*[］\]]/g, '')
        .trim();
    }

    // ========================================
    // CSV解析
    // ========================================

    function parseCSV(text) {
      const rows = [];

      let row = [];
      let value = '';
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (char === '"') {
          if (quoted && text[i + 1] === '"') {
            value += '"';
            i++;
          } else {
            quoted = !quoted;
          }
        } else if (char === ',' && !quoted) {
          row.push(value);
          value = '';
        } else if (
          (char === '\n' || char === '\r') &&
          !quoted
        ) {
          if (
            char === '\r' &&
            text[i + 1] === '\n'
          ) {
            i++;
          }

          row.push(value);

          if (row.some(cell => cell.trim() !== '')) {
            rows.push(row);
          }

          row = [];
          value = '';
        } else {
          value += char;
        }
      }

      if (value !== '' || row.length > 0) {
        row.push(value);

        if (row.some(cell => cell.trim() !== '')) {
          rows.push(row);
        }
      }

      return rows;
    }

    // ========================================
    // Wikipedia APIでページ取得
    // ========================================

    async function fetchWikipediaTable(group) {
      const apiURL = new URL(
        'https://ja.wikipedia.org/w/api.php'
      );

      apiURL.search = new URLSearchParams({
        action: 'parse',
        page: group.page,
        prop: 'text',
        format: 'json',
        origin: '*'
      }).toString();

      const response = await fetch(apiURL.toString(), {
        method: 'GET',
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error(
          group.name +
          'のWikipedia取得失敗: HTTP ' +
          response.status
        );
      }

      const data = await response.json();

      if (data.error) {
        throw new Error(
          data.error.info || 'Wikipedia APIエラー'
        );
      }

      if (!data.parse?.text?.['*']) {
        throw new Error(
          group.name + 'のWikipedia本文を取得できません。'
        );
      }

      const parser = new DOMParser();

      // APIが返したHTML全体をDOM化する
      // 特定のIDや階層を前提としない
      return parser.parseFromString(
        data.parse.text['*'],
        'text/html'
      );
    }

    // ========================================
    // テーブルの行・セルを取得
    // 入れ子のテーブルの行は混ぜない
    // ========================================

    function getOwnRows(table) {
      return Array.from(
        table.querySelectorAll('tr')
      ).filter(row => row.closest('table') === table);
    }

    function getOwnCells(row) {
      return Array.from(row.children).filter(cell =>
        cell.matches('th, td')
      );
    }

    // ========================================
    // 見出しから列を判定
    // ========================================

    function findColumnIndexes(rows) {
      for (let r = 0; r < rows.length; r++) {
        const cells = getOwnCells(rows[r]);

        if (cells.length < 2) {
          continue;
        }

        const headers = cells.map(cell =>
          normalizeHeader(cell.textContent)
        );

        const birthdayIndex = headers.findIndex(text =>
          text.includes('生年月日')
        );

        if (birthdayIndex === -1) {
          continue;
        }

        // 名前列を探す
        let nameIndex = headers.findIndex(text =>
          /^(名前|氏名|メンバー名|メンバー)$/.test(text)
        );

        // 名前列の見出しがない場合は、
        // 生年月日列の左側にある列を優先
        if (nameIndex === -1) {
          const possibleIndexes = [
            birthdayIndex - 1,
            0,
            birthdayIndex + 1
          ];

          for (const index of possibleIndexes) {
            if (
              index >= 0 &&
              index < cells.length &&
              index !== birthdayIndex
            ) {
              nameIndex = index;
              break;
            }
          }
        }

        if (
          nameIndex !== -1 &&
          nameIndex !== birthdayIndex
        ) {
          return {
            headerRowIndex: r,
            nameIndex,
            birthdayIndex
          };
        }
      }

      return null;
    }

    // ========================================
    // 年齢表記を抽出
    // ========================================

    function extractAge(text) {
      const normalized = String(text ?? '')
        .normalize('NFKC')
        .replace(/\s+/g, ' ');

      // 例: (22歳)、（22歳）
      const match = normalized.match(
        /[（(]\s*(\d{1,3})\s*歳\s*[）)]/
      );

      if (!match) {
        return null;
      }

      const age = Number(match[1]);

      return Number.isFinite(age) ? age : null;
    }

    // ========================================
    // すべての階層からメンバー表を探索
    // ========================================

    function extractMembersFromTable(doc, groupName) {
      const result = new Map();

      // IDの有無に関係なく全テーブルを検索
      const tables = Array.from(
        doc.querySelectorAll('table')
      );

      console.log(
        groupName + '：探索テーブル数',
        tables.length
      );

      // 指定IDのテーブルがあれば先に調べるが、
      // 見つからなくても全テーブルを探索する
      const group = WIKIPEDIA_GROUPS.find(
        item => item.name === groupName
      );

      const orderedTables = group
        ? tables.slice().sort((a, b) => {
            if (a.id === group.tableId) return -1;
            if (b.id === group.tableId) return 1;
            return 0;
          })
        : tables;

      let matchedTableCount = 0;

      for (const table of orderedTables) {
        const rows = getOwnRows(table);

        if (rows.length === 0) {
          continue;
        }

        const indexes = findColumnIndexes(rows);

        if (!indexes) {
          continue;
        }

        matchedTableCount++;

        const {
          headerRowIndex,
          nameIndex,
          birthdayIndex
        } = indexes;

        console.log(
          groupName + '：候補テーブル',
          {
            id: table.id || '(IDなし)',
            nameIndex,
            birthdayIndex,
            rows: rows.length
          }
        );

        for (
          let r = headerRowIndex + 1;
          r < rows.length;
          r++
        ) {
          const cells = getOwnCells(rows[r]);

          if (
            cells.length <= nameIndex ||
            cells.length <= birthdayIndex
          ) {
            continue;
          }

          const nameCell = cells[nameIndex];
          const birthdayCell = cells[birthdayIndex];

          // 見出し行を除外
          if (
            nameCell.tagName === 'TH' ||
            birthdayCell.tagName === 'TH'
          ) {
            continue;
          }

          const name = normalizeName(
            nameCell.textContent
          );

          const birthdayText =
            birthdayCell.textContent.trim();

          if (!name || !birthdayText) {
            continue;
          }

          const age = extractAge(birthdayText);

          // 年齢表記がない行は推測しない
          if (age === null) {
            continue;
          }

          result.set(name, {
            name,
            age,
            group: groupName,
            eligible: age <= MAX_AGE
          });
        }

        // メンバーを取得できたテーブルを採用
        if (result.size > 0) {
          break;
        }
      }

      if (matchedTableCount === 0) {
        throw new Error(
          groupName +
          'のページ内に生年月日列を持つテーブルがありません。'
        );
      }

      if (result.size === 0) {
        throw new Error(
          groupName +
          'のメンバー表は見つかりましたが、' +
          '「（x歳）」形式の年齢を抽出できませんでした。'
        );
      }

      console.log(
        groupName + '：年齢取得人数',
        result.size
      );

      console.log(
        groupName + '：22歳以下',
        Array.from(result.values()).filter(
          member => member.eligible
        ).length
      );

      return result;
    }

    // ========================================
    // 3グループの年齢情報を取得
    // ========================================

    async function loadEligibleMembers() {
      eligibleMembers.clear();

      const errors = [];

      for (const group of WIKIPEDIA_GROUPS) {
        setMessage(
          'Wikipediaを取得しています...\n' +
          group.name
        );

        try {
          const doc = await fetchWikipediaTable(group);

          const members = extractMembersFromTable(
            doc,
            group.name
          );

          for (const [name, member] of members) {
            // 同名メンバーによる誤照合を避けるため、
            // 名前と所属グループの情報を保持
            eligibleMembers.set(
              group.name + '|' + name,
              member
            );
          }
        } catch (error) {
          console.error(
            group.name + 'の取得エラー:',
            error
          );

          errors.push(
            group.name + ': ' + error.message
          );
        }
      }

      // どれかのグループが失敗した場合は
      // 不完全な名簿で評価を開始しない
      if (errors.length > 0) {
        throw new Error(
          'Wikipediaの年齢情報を完全に取得できませんでした。\n' +
          errors.join('\n')
        );
      }

      const eligibleCount = Array.from(
        eligibleMembers.values()
      ).filter(member => member.eligible).length;

      console.log(
        '全グループの取得人数:',
        eligibleMembers.size
      );

      console.log(
        '22歳以下の人数:',
        eligibleCount
      );

      if (eligibleCount === 0) {
        throw new Error(
          '22歳以下のメンバーを取得できませんでした。'
        );
      }
    }

    // ========================================
    // Newtagの除外条件
    // ========================================

    function isExcludedNewtag(value) {
      const newtag = String(value ?? '').trim();

      return (
        newtag === '' ||
        newtag.includes('その他') ||
        newtag.includes('エラー')
      );
    }

    // ========================================
    // Newtagから22歳以下のメンバーを探す
    // ========================================

    function findEligibleMember(newtag) {
      const normalizedTag = normalizeName(newtag);

      if (!normalizedTag) {
        return null;
      }

      // メンバー名がNewtagに含まれるか確認
      for (const member of eligibleMembers.values()) {
        if (!member.eligible) {
          continue;
        }

        if (
          normalizedTag.includes(
            normalizeName(member.name)
          )
        ) {
          return member;
        }
      }

      return null;
    }

    // ========================================
    // CSVから画像URLを抽出
    // ========================================

    function extractImagesFromCSV(csvText) {
      const rows = parseCSV(
        csvText.replace(/^\uFEFF/, '')
      );

      if (rows.length < 2) {
        throw new Error(
          'CSVにデータ行がありません。'
        );
      }

      const headers = rows[0].map(value =>
        value.trim().toLowerCase()
      );

      const srcIndex = headers.indexOf('src');
      const newtagIndex = headers.indexOf('newtag');

      if (
        srcIndex === -1 ||
        newtagIndex === -1
      ) {
        throw new Error(
          'src列またはNewtag列が見つかりません。'
        );
      }

      const result = [];
      const seen = new Set();

      let excludedEmpty = 0;
      let excludedAge = 0;
      let excludedURL = 0;

      for (const row of rows.slice(1)) {
        const src = String(
          row[srcIndex] ?? ''
        ).trim();

        const newtag = String(
          row[newtagIndex] ?? ''
        ).trim();

        // srcが空、Newtagが空・その他・エラー
        if (!src || isExcludedNewtag(newtag)) {
          excludedEmpty++;
          continue;
        }

        // Wikipediaの年齢が22歳以下のメンバーか確認
        const member = findEligibleMember(newtag);

        if (!member) {
          excludedAge++;
          continue;
        }

        // HTTP / HTTPS以外は除外
        try {
          const url = new URL(src);

          if (
            url.protocol !== 'http:' &&
            url.protocol !== 'https:'
          ) {
            excludedURL++;
            continue;
          }
        } catch {
          excludedURL++;
          continue;
        }

        // URLの重複を除去
        if (seen.has(src)) {
          continue;
        }

        seen.add(src);

        result.push({
          src,
          newtag,
          memberName: member.name,
          age: member.age,
          group: member.group
        });
      }

      console.log('CSV判定結果:', {
        対象画像: result.length,
        除外空欄その他エラー: excludedEmpty,
        除外年齢条件: excludedAge,
        除外URL不正: excludedURL
      });

      return result;
    }

    // ========================================
    // ランダムシャッフル
    // ========================================

    function shuffle(array) {
      const result = array.slice();

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(
          Math.random() * (i + 1)
        );

        [result[i], result[j]] = [
          result[j],
          result[i]
        ];
      }

      return result;
    }

    // ========================================
    // 画像読み込み確認
    // ========================================

    function preloadImage(src) {
      return new Promise(resolve => {
        const image = new Image();

        image.onload = () => resolve(true);
        image.onerror = () => resolve(false);

        image.src = src;
      });
    }

    async function validateImages(list) {
      const valid = [];

      for (let i = 0; i < list.length; i++) {
        setMessage(
          '画像を確認しています...\n' +
          (i + 1) + ' / ' + list.length
        );

        const item = list[i];
        const loaded = await preloadImage(item.src);

        if (loaded) {
          valid.push(item);
        } else {
          failedImages.add(item.src);
        }
      }

      return valid;
    }

    // ========================================
    // データ取得
    // ========================================

    async function loadData() {
      setButtonsEnabled(false);
      imageElement.hidden = true;

      setMessage('データを読み込んでいます...');

      try {
        // 先にWikipediaの年齢情報を取得
        await loadEligibleMembers();

        setMessage(
          'スプレッドシートを読み込んでいます...'
        );

        const response = await fetch(DATA_URL, {
          method: 'GET',
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(
            'CSV取得失敗: HTTP ' + response.status
          );
        }

        const csvText = await response.text();

        if (
          /^\s*<!DOCTYPE html/i.test(csvText) ||
          /^\s*<html/i.test(csvText)
        ) {
          throw new Error(
            'CSVではなくHTMLが返されました。\n' +
            '公開CSVのURLを確認してください。'
          );
        }

        const candidates = extractImagesFromCSV(
          csvText
        );

        if (candidates.length === 0) {
          throw new Error(
            '表示対象の画像がありません。\n' +
            'srcとNewtag、メンバー名、年齢条件を確認してください。'
          );
        }

        images = await validateImages(candidates);

        if (images.length === 0) {
          throw new Error(
            '表示可能な画像がありません。\n' +
            'src列のURLやアクセス制限を確認してください。'
          );
        }

        remainingImages = shuffle(images);

        showNextImage();

      } catch (error) {
        console.error('データ取得エラー:', error);

        imageElement.hidden = true;

        setMessage(
          'データを取得できませんでした。\n\n' +
          (error.message ||
            '不明なエラーが発生しました。') +
          '\n\nWikipediaの取得状況、テーブル構造、' +
          '公開CSVのURL、ネットワーク接続を確認してください。'
        );

        setButtonsEnabled(false);
      }
    }

    // ========================================
    // 次の画像を表示
    // ========================================

    async function showNextImage() {
      if (isLoadingImage) {
        return;
      }

      isLoadingImage = true;
      setButtonsEnabled(false);

      try {
        while (remainingImages.length > 0) {
          const item = remainingImages.pop();

          if (failedImages.has(item.src)) {
            continue;
          }

          const token = ++requestToken;

          setMessage('画像を読み込んでいます...');

          const loaded = await preloadImage(item.src);

          if (token !== requestToken) {
            return;
          }

          if (!loaded) {
            failedImages.add(item.src);
            continue;
          }

          currentImage = item.src;
          currentTag = item.newtag;

          imageElement.src = item.src;
          imageElement.hidden = false;

          hideMessage();
          setButtonsEnabled(true);

          console.log('表示中の画像:', {
            src: item.src,
            newtag: item.newtag,
            member: item.memberName,
            age: item.age,
            group: item.group
          });

          return;
        }

        currentImage = null;
        currentTag = '';

        imageElement.hidden = true;

        setMessage(
          'すべての画像を確認しました。\n\n' +
          '表示可能な画像：' + images.length + ' 枚'
        );

      } finally {
        isLoadingImage = false;
      }
    }

    // ========================================
    // 評価ボタン
    // ========================================

    function rateImage(rating) {
      if (!currentImage || isLoadingImage) {
        return;
      }

      console.log('評価:', {
        rating,
        imageURL: currentImage,
        newtag: currentTag
      });

      currentImage = null;
      currentTag = '';

      showNextImage();
    }

    document.getElementById('good').addEventListener(
      'click',
      () => rateImage('GOOD')
    );

    document.getElementById('soso').addEventListener(
      'click',
      () => rateImage('SOSO')
    );

    document.getElementById('bad').addEventListener(
      'click',
      () => rateImage('BAD')
    );

    // ========================================
    // 起動
    // ========================================

    loadData();
  </script>
</body>
</html>
